<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/icon-192-any.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FBF8F3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artisan AI — Crafting a Better Tomorrow</title>
    <meta name="description" content="AI-Powered B2B craft marketplace, voice-first cataloging, and explainable dynamic pricing engine for rural artisans." />
    <!-- Google Fonts: Playfair Display (Serif), Plus Jakarta Sans (Sans), Caveat & Alex Brush (Script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Completely hide all Google Translate top banners, bars, and tooltips */
      .goog-te-banner-frame, 
      .goog-te-banner-frame.skiptranslate, 
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      #goog-gt-tt, 
      .goog-te-balloon-frame,
      .VIpgJd-yD05fd-Lg4t2b,
      .VIpgJd-yD05fd-Lg4t2b-sLp2vf,
      .VIpgJd-yD05fd-vFu4df,
      .VIpgJd-yD05fd-yScalb {
        display: none !important;
        visibility: hidden !important;
        height: 0px !important;
        width: 0px !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'te,hi,en,ta,bn',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="text/javascript">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
