<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/artisan-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#d97706" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artisan AI — Rural Commerce & Business Intelligence SaaS</title>
    <meta name="description" content="AI-Powered B2B craft marketplace, voice-first cataloging, and explainable dynamic pricing engine for rural artisans." />
    <style>
      /* Completely hide all Google Translate top banners, bars, and tooltips */
      .goog-te-banner-frame, 
      .goog-te-banner-frame.skiptranslate, 
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      #goog-gt-tt, 
      .goog-te-balloon-frame,
      .VIpgJd-yD05fd-Lg4t2b,
      .VIpgJd-yD05fd-Lg4t2b-sLp2vf,
      .VIpgJd-yD05fd-vFu4df,
      .VIpgJd-yD05fd-yScalb {
        display: none !important;
        visibility: hidden !important;
        height: 0px !important;
        width: 0px !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'te,hi,en,ta,bn',
              layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (err) {
          console.warn('Google Translate initialization skipped:', err);
        }
      }
    </script>
    <script type="text/javascript" async defer src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" onerror="console.warn('Google Translate script unavailable');"></script>
    <script type="text/javascript">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
