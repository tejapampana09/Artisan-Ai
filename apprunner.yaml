version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    ENVIRONMENT: production
    DEMO_MODE: "false"
    ONDC_PROTOTYPE_ENABLED: "false"
