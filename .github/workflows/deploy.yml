name: CI Test Gate & Auto Deploy (Frontend & Backend)

on:
  push:
    branches:
      - main

concurrency:
  group: eb-deploy-production
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. Backend Test Gate — must pass before any deploy step runs
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Pytest Suite Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: test
          DEMO_MODE: "true"
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests

  # ════════════════════════════════════════════════════════════════════════════
  # 2. RDS Schema Migration — runs AFTER tests, BEFORE backend EB deploy
  #    Applies `alembic upgrade head` against the production PostgreSQL RDS.
  #    If migration fails, the backend deploy is blocked automatically.
  # ════════════════════════════════════════════════════════════════════════════
  migrate-rds:
    name: RDS Schema Migration (alembic upgrade head)
    needs: test-backend
    runs-on: ubuntu-latest
    # NOTE: No job-level `if` using secrets — that is not allowed by GitHub Actions.
    # Instead each step guards itself: if DATABASE_URL is empty it skips gracefully.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate RDS_DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
        run: |
          # Guard 1: secret not set at all → skip gracefully
          if [ -z "$DATABASE_URL" ]; then
            echo "SKIP_MIGRATION=true" >> $GITHUB_ENV
            echo "⚠ RDS_DATABASE_URL secret is not configured — migration skipped (no-op)."
            echo "  To enable: Settings → Secrets → Actions → New secret: RDS_DATABASE_URL"
            echo "  Value format: postgresql://user:password@xxx.rds.amazonaws.com:5432/dbname"
            exit 0
          fi
          # Guard 2: secret still contains placeholder text (e.g. <your-rds-endpoint>)
          if echo "$DATABASE_URL" | grep -qiE '<[^>]+>|your-rds-endpoint|example\.com'; then
            echo "SKIP_MIGRATION=true" >> $GITHUB_ENV
            echo "⚠ RDS_DATABASE_URL contains placeholder text ('<your-rds-endpoint>') — skipping migration (no-op)."
            echo "  To run live RDS migrations in CI:"
            echo "  1. Set up an AWS RDS PostgreSQL instance in ap-south-1"
            echo "  2. Go to GitHub Repo -> Settings -> Secrets and variables -> Actions"
            echo "  3. Update RDS_DATABASE_URL with your actual endpoint:"
            echo "     postgresql://<db_user>:<db_password>@<your-db-identifier>.xxxx.ap-south-1.rds.amazonaws.com:5432/<db_name>"
            echo "  Continuing deployment..."
            exit 0
          fi
          echo "SKIP_MIGRATION=false" >> $GITHUB_ENV
          echo "✓ RDS_DATABASE_URL looks valid — proceeding with migration."

      - name: Show current Alembic revision (before migration)
        if: env.SKIP_MIGRATION == 'false'
        env:
          DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
          # ENVIRONMENT=ci: bypasses validate_production_config() JWT check at import time.
          # The migration runner only needs DATABASE_URL — not JWT_SECRET_KEY.
          ENVIRONMENT: ci
          PYTHONPATH: .
        run: |
          echo "=== Current RDS Alembic revision ==="
          python -m alembic current || echo "(no revision yet — fresh database)"

      - name: Run Alembic Migrations
        if: env.SKIP_MIGRATION == 'false'
        env:
          DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
          ENVIRONMENT: ci
          PYTHONPATH: .
        run: |
          echo "=== Running: alembic upgrade head ==="
          python -m alembic upgrade head

      - name: Show revision after migration
        if: env.SKIP_MIGRATION == 'false'
        env:
          DATABASE_URL: ${{ secrets.RDS_DATABASE_URL }}
          ENVIRONMENT: ci
          PYTHONPATH: .
        run: |
          echo "=== Applied migration. Current revision: ==="
          python -m alembic current

  # ════════════════════════════════════════════════════════════════════════════
  # 3. Frontend Build & S3 Deploy — runs in parallel with migrate-rds
  #    Only depends on test-backend, not the migration (frontend is independent)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-frontend:
    name: Build & Deploy Frontend to S3
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend Bundle
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '26058075206-on14bkf0hlrenshpogiglj07ftb8qgba.apps.googleusercontent.com' }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_ArtisanAI2026' }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Static Assets to S3 (immutable cache)
        run: |
          aws s3 sync frontend/dist s3://artisan-ai-frontend-ap-south-1-339954341605 \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (short TTL for instant rollout)
        run: |
          aws s3 cp frontend/dist/index.html \
            s3://artisan-ai-frontend-ap-south-1-339954341605/index.html \
            --cache-control "public, max-age=0, s-maxage=60, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E8OV8X242WBXH --paths "/*"

  # ════════════════════════════════════════════════════════════════════════════
  # 4. Backend EB Deploy — waits for BOTH tests AND migration to succeed
  #    This guarantees schema is up-to-date before new app code goes live.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-backend:
    name: Package & Deploy Backend to Elastic Beanstalk (Mumbai)
    needs: [test-backend, migrate-rds]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Package Backend Zip Bundle
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_LABEL="v-auto-${{ github.run_number }}-${SHORT_SHA}"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> $GITHUB_ENV
          zip -r "deploy-${VERSION_LABEL}.zip" backend requirements.txt Procfile .ebextensions alembic.ini alembic \
            -x "*.pyc" "*__pycache__*" "*test_ci.db*" "*.db" "*.db-shm" "*.db-wal" "backend/tests/*"

      - name: Upload Zip to S3
        run: |
          aws s3 cp "deploy-${VERSION_LABEL}.zip" \
            "s3://artisan-ai-eb-ap-south-1-339954341605/deploy-${VERSION_LABEL}.zip" \
            --region ap-south-1

      - name: Create Elastic Beanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name artisan-ai-backend \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="artisan-ai-eb-ap-south-1-339954341605",S3Key="deploy-${VERSION_LABEL}.zip" \
            --description "Auto-deploy commit ${{ github.sha }}" \
            --region ap-south-1

      - name: Wait for EB Environment to be Ready
        run: |
          echo "Checking if EB environment is in Ready state before deploying..."
          WAIT_COUNT=0
          while true; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names artisan-ai-backend-prod \
              --region ap-south-1 \
              --query "Environments[0].Status" \
              --output text)
            if [[ "$STATUS" == "Ready" ]]; then
              echo "✓ EB environment is Ready to receive new deployment."
              break
            fi
            echo "  EB environment status is '${STATUS}'. Waiting 15s before updating (${WAIT_COUNT}s elapsed)..."
            sleep 15
            WAIT_COUNT=$((WAIT_COUNT + 15))
            if [[ $WAIT_COUNT -ge 300 ]]; then
              echo "⚠ Timed out waiting for previous environment operation to complete."
              exit 1
            fi
          done

      - name: Update Elastic Beanstalk Environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name artisan-ai-backend-prod \
            --version-label "${VERSION_LABEL}" \
            --region ap-south-1

      - name: Poll EB Environment Health (wait for Green)
        run: |
          echo "Waiting for EB environment to reach Ready/Green state..."
          MAX_WAIT=300
          ELAPSED=0
          while [[ $ELAPSED -lt $MAX_WAIT ]]; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names artisan-ai-backend-prod \
              --region ap-south-1 \
              --query "Environments[0].Status" \
              --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names artisan-ai-backend-prod \
              --region ap-south-1 \
              --query "Environments[0].Health" \
              --output text)
            echo "  Status=${STATUS} Health=${HEALTH} (${ELAPSED}s elapsed)"
            if [[ "$STATUS" == "Ready" && "$HEALTH" == "Green" ]]; then
              echo "✓ EB environment is Ready and Green!"
              exit 0
            fi
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          echo "⚠ Timed out waiting for EB to reach Green. Check AWS console."
          exit 1
