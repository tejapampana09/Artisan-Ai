name: CI Test Gate & Auto Deploy (Neon & Render)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. Backend Test Gate — must pass before deployment
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Pytest Suite Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: test
          DEMO_MODE: "true"
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests

  # ════════════════════════════════════════════════════════════════════════════
  # 2. Database Schema Migration (Neon PostgreSQL)
  # ════════════════════════════════════════════════════════════════════════════
  migrate-database:
    name: Database Schema Migration (alembic upgrade head)
    needs: [test-backend, build-frontend, check-mobile, test-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations against Neon DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL }}
          ENVIRONMENT: ci
          PYTHONPATH: .
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is required"; exit 1; }
          echo "Running database migrations"
          python -m alembic upgrade head
          echo "=== Verifying Current Migration Revision ==="
          python -m alembic current

  # ════════════════════════════════════════════════════════════════════════════
  # 3. Frontend Build Verification
  # ════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend Bundle Gate
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          npm test
          npm run lint

      - name: Build Production Frontend Bundle
        env:
          VITE_API_BASE: https://artisan-ai-rpw7.onrender.com/api
        run: |
          cd frontend
          npm run build

  # ════════════════════════════════════════════════════════════════════════════
  # 4. Trigger Render Deploy & Verify Production Health
  # ════════════════════════════════════════════════════════════════════════════
  deploy-render:
    name: Deploy to Render & Verify Health
    needs: [test-backend, migrate-database, build-frontend, check-mobile, test-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "RENDER_DEPLOY_HOOK_URL secret is required"; exit 1; }
          echo "Triggering Render Deploy Webhook..."
          curl --connect-timeout 10 --max-time 30 -f -X POST "$RENDER_DEPLOY_HOOK"

      - name: Check Live Render Backend Health
        run: |
          echo "Checking https://artisan-ai-rpw7.onrender.com/api/ready..."
          for i in {1..6}; do
            STATUS=$(curl --connect-timeout 10 --max-time 20 -s -o /dev/null -w "%{http_code}" https://artisan-ai-rpw7.onrender.com/api/ready || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✓ Render backend is healthy and responding!"
              exit 0
            fi
            echo "Waiting 10s for backend..."
            sleep 10
          done
          echo "Backend readiness failed after deployment."
          exit 1

  check-mobile:
    name: Mobile Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile

  test-migrations:
    name: Fresh PostgreSQL Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artisan_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: artisan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artisan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql://artisan_test:local_ci_only@localhost:5432/artisan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic upgrade head
