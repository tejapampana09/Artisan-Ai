name: CI Test Gate & Auto Deploy (Neon & Render)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # 1. Backend Test Gate — must pass before deployment
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Backend Pytest Suite Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: test
          DEMO_MODE: "true"
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests

  # ════════════════════════════════════════════════════════════════════════════
  # 2. Database Schema Migration (Neon PostgreSQL)
  # ════════════════════════════════════════════════════════════════════════════
  migrate-database:
    name: Database Schema Migration (alembic upgrade head)
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations against Neon DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || 'postgresql+psycopg://neondb_owner:npg_bmWq3vQFNpk5@ep-rapid-math-b3if2ynz-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require' }}
          ENVIRONMENT: ci
          PYTHONPATH: .
        run: |
          echo "=== Running: alembic upgrade head against Neon DB ==="
          python -m alembic upgrade head
          echo "=== Verifying Current Migration Revision ==="
          python -m alembic current

  # ════════════════════════════════════════════════════════════════════════════
  # 3. Frontend Build Verification
  # ════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend Bundle Gate
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend Bundle
        env:
          VITE_API_BASE: https://artisan-ai-rpw7.onrender.com/api
        run: |
          cd frontend
          npm run build

  # ════════════════════════════════════════════════════════════════════════════
  # 4. Trigger Render Deploy & Verify Production Health
  # ════════════════════════════════════════════════════════════════════════════
  deploy-render:
    name: Deploy to Render & Verify Health
    needs: [test-backend, migrate-database, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Deploy Webhook..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"

      - name: Check Live Render Backend Health
        run: |
          echo "Checking https://artisan-ai-rpw7.onrender.com/api/health..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://artisan-ai-rpw7.onrender.com/api/health || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✓ Render backend is healthy and responding!"
              exit 0
            fi
            echo "Waiting 10s for backend..."
            sleep 10
          done
          echo "Render is booting up or processing deploy."
          exit 0
