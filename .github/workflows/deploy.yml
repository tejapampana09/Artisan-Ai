name: CI Test Gate & Auto Deploy (Frontend & Backend)

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    name: Backend Pytest Suite Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          ENVIRONMENT: test
          DEMO_MODE: "true"
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests

  deploy-frontend:
    name: Build & Deploy Frontend to S3
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Frontend Bundle
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '26058075206-on14bkf0hlrenshpogiglj07ftb8qgba.apps.googleusercontent.com' }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_ArtisanAI2026' }}
        run: |
          cd frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync frontend/dist s3://artisan-ai-frontend-ap-south-1-339954341605 --delete --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html s3://artisan-ai-frontend-ap-south-1-339954341605/index.html --cache-control "public, max-age=0, s-maxage=60, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E8OV8X242WBXH --paths "/*"

  deploy-backend:
    name: Package & Deploy Backend to Elastic Beanstalk (Mumbai)
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Package Backend Zip Bundle
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_LABEL="v-auto-${{ github.run_number }}-${SHORT_SHA}"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> $GITHUB_ENV
          zip -r "deploy-${VERSION_LABEL}.zip" backend requirements.txt Procfile .ebextensions -x "*.pyc" "*__pycache__*" "*test_ci.db*" "*.db"

      - name: Upload Zip to S3
        run: |
          aws s3 cp "deploy-${VERSION_LABEL}.zip" "s3://artisan-ai-eb-ap-south-1-339954341605/deploy-${VERSION_LABEL}.zip" --region ap-south-1

      - name: Create Elastic Beanstalk Application Version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name artisan-ai-backend \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="artisan-ai-eb-ap-south-1-339954341605",S3Key="deploy-${VERSION_LABEL}.zip" \
            --description "Auto-deploy commit ${{ github.sha }}" \
            --region ap-south-1

      - name: Update Elastic Beanstalk Environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name artisan-ai-backend-prod \
            --version-label "${VERSION_LABEL}" \
            --region ap-south-1
